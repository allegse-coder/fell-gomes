span><div><b>Patrícia Frazão<\u002Fb><small>Aluna de IELTS<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <h3>Consegui a nota que precisava.<\u002Fh3>\n          <p>A preparação para o IELTS foi cirúrgica. O Fell sabe exatamente o que a prova cobra e como treinar para isso.<\u002Fp>\n          <span class=\"stars\" role=\"img\" aria-label=\"5 de 5 estrelas\">★★★★★<\u002Fspan>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <div class=\"dots\" aria-hidden=\"true\">\n        <span class=\"dot {{dots.d0}}\"><\u002Fspan><span class=\"dot {{dots.d1}}\"><\u002Fspan><span class=\"dot {{dots.d2}}\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"center-cta rv\">\n        <p style=\"font-weight: 800; font-size: clamp(22px, 2.2vw, 28px); letter-spacing: -0.02em\">Sua história pode ser a próxima.<\u002Fp>\n        <a class=\"cta cta-lg\" href=\"{{waCta}}\" target=\"_blank\" rel=\"noopener noreferrer\">\n          <span style=\"position: relative; z-index: 2\">Agendar minha aula grátis<\u002Fspan>\n          <span class=\"ic\" aria-hidden=\"true\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= 9. DÚVIDAS FREQUENTES ================= -->\n  <section class=\"sec faq {{c.faq}}\" id=\"duvidas\" data-reveal=\"faq\">\n    <div class=\"wrap faq-grid\">\n      <div class=\"rv\">\n        <h2 class=\"h2\">Dúvidas <span class=\"hl\">frequentes<\u002Fspan><\u002Fh2>\n        <p class=\"lead\" style=\"margin-top: 20px; max-width: 30ch\">Não achou o que procurava? Me chama no WhatsApp: <a href=\"{{waLink}}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: #C8F135; font-weight: 600\">{{cfg.whatsappDisplay}}<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"svc-list\">\n x 0px' });\n        var els = scope.querySelectorAll('[data-reveal]');\n        for (var i = 0; i < els.length; i++) this.io.observe(els[i]);\n      }\n    } catch (err) { this.setState({ anim: false }); }\n    this.onScroll = function () {\n      try {\n        var hero = scope.querySelector('#topo');\n        var limit = hero ? hero.offsetHeight - 80 : 700;\n        var past = (window.scrollY || window.pageYOffset || 0) > limit;\n        if (past !== self.state.sticky) self.setState({ sticky: past });\n      } catch (err) {}\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n  }\n\n  componentWillUnmount() {\n    if (this.io) this.io.disconnect();\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n  }\n\n  renderVals() {\n    var st = this.state;\n    var self = this;\n    var wa = 'https://wa.me/' + CONFIG.WHATSAPP;\n    var reveal = function (k) { return st.seen[k] ? 'in' : ''; };\n\n    var s = {}, f = {};\n    for (var i = 0; i < 6; i++) {\n      (function (n) {\n        s['c' + n] = st.svc === n ? 'open' : '';\n        s['e' + n] = st.svc === n ? 'true' : 'false';\n        s['t' + n] = function () { self.setState({ svc: self.state.svc === n ? -1 : n }); };\n        f['c' + n] = st.faq === n ? 'open' : '';\n        f['e' + n] = st.faq === n ? 'true' : 'false';\n        f['t' + n] = function () { self.setState({ faq: self.state.faq === n ? -1 : n }); };\n      })(i);\n    }\n\n    return {\n      rootRef: this.rootRef,\n      rootCls: st.anim ? 'anim' : '',\n      c: {\n        statement: reveal('statement'), para: reveal('para'), sobre: reveal('sobre'),\n        aulas: reveal('aulas'), como: reveal('como'), depo: reveal('depo'),\n        faq: reveal('faq'), final: reveal('final')\n      },\n      s: s,\n      f: f,\n      cfg: { whatsappDisplay: CONFIG.WHATSAPP_DISPLAY, instagram: CONFIG.INSTAGRAM, email: CONFIG.EMAIL },\n      waCta: wa + '?text=' + encodeURIComponent(CONFIG.WHATSAPP_MSG),\n      waLink: wa,\n      igLink: 'https://instagram.com/' + CONFIG.INSTAGRAM,\n      mailLink: 'mailto:' + CONFIG.EMAIL,\n      menuOpen: st.menuOpen,\n      menuClosed: !st.menuOpen,\n      menuExpanded: st.menuOpen ? 'true' : 'false',\n      menuLabel: st.menuOpen ? 'Fechar menu' : 'Abrir menu',\n      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen }); },\n      closeMenu: function () { self.setState({ menuOpen: false }); },\n      stickyCls: st.sticky ? 'show' : '',\n      stickyTab: st.sticky ? '0' : '-1',\n      dots: { d0: st.testi === 0 ? 'on' : '', d1: st.testi === 1 ? 'on' : '', d2: st.testi === 2 ? 'on' : '' },\n      onTestiScroll: function (e) {\n        var el = e && e.currentTarget;\n        if (!el) return;\n        var idx = Math.round(el.scrollLeft / Math.max(1, (el.scrollWidth - el.clientWidth) / 2));\n        idx = Math.max(0, Math.min(2, idx));\n        if (idx !== self.state.testi) self.setState({ testi: idx });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
